<script>
const DEF=[["new","Новая закупка","#55d0e0"],["work","В работе","#2fc6f6"],["bid","Заявка подана","#47e4c2"],["contract","Ждем договор","#ffa900"],["pay","В оплате","#c3d632"],["done","Завершена","#7bd500"],["lost","Проиграна","#ff7b77"]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rub=n=>Number(n||0).toLocaleString("ru-RU")+" ₽";
let db,user,owner=false,cur=null,mode="",view="deals",kv="kanban",flt="all",own=false,sp="all",tw="mine",tu="all",tdone=false,q="",adm="staff",stg=null,memS=null,S={tasks:[],deals:[],orgs:[],users:[],stages:[],req:{}},L={};

const FIELDS=[["num","Номер закупки"],["title","Краткое название"],["org","Организация"],["inn","ИНН"],["url","Ссылка на закупку"],["phone","Телефон"],["email","Email"],["amount","Сумма"],["due","Дата завершения"]];
const fmt=t=>t?new Date(t).toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}):"";
const stN=k=>(stages().find(s=>s[0]===k)||[0,"—"])[1];
const rel=t=>{if(!t)return"";const d=new Date(t),n=new Date(),k=Math.round((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);return(k===0?"сегодня":k===1?"вчера":d.toLocaleDateString("ru-RU",{day:"numeric",month:"short"}))+", "+d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})};
const fmtD=x=>x?new Date(x+"T00:00").toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"}):"";
const orgLink=d=>{const g=orgOf(d.org,d.inn);return g?`<button type="button" class="lnk" onclick="event.stopPropagation();viewOrg('${g.id}')">${esc(d.org)} ›</button>`:esc(d.org||"Организация не указана")};
const histHtml=d=>{const h=d.hist&&d.hist.length?d.hist:(d.created?[{t:d.created,a:"",e:"c",n:stN(d.stage)}]:[]);return `<div class="hs"><b>История</b>${h.map(x=>`<div><small>${fmt(x.t)}</small> — ${x.e==="c"?"Закупка создана в этапе «"+esc(x.n)+"»":"Перенесена из «"+esc(x.f)+"» в «"+esc(x.n)+"»"}${x.a?" <small>("+esc(x.a)+")</small>":""}</div>`).join("")||`<div class="mu">Записей пока нет.</div>`}</div>`};

const setErr=m=>{const e=$("#err");if(e){e.textContent=m;e.scrollIntoView({block:"nearest"})}};
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return "f"+(h>>>0).toString(16)}}
const salt=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const getS=()=>{try{return JSON.parse(localStorage.getItem("bl-sess"))||memS}catch(e){return memS}};
const setS=v=>{memS=v;try{v?localStorage.setItem("bl-sess",JSON.stringify(v)):localStorage.removeItem("bl-sess")}catch(e){}};
const U=id=>S.users.find(u=>u.id===id);
const nm=id=>!id?"Не назначен":id===cur?.id?"Вы":(U(id)?.name||"Не назначен");
const ini=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const av=id=>{const u=U(id);if(!u)return `<span class="av" title="Не назначен">?</span>`;if(u.photo&&String(u.photo).startsWith("data:image/"))return `<span class="av" style="background:#8a99a8 url('${u.photo}') center/cover no-repeat${isAdmin()&&MCOK(u.mc)?`;box-shadow:0 0 0 2px var(--sf),0 0 0 4px ${u.mc}`:""}" title="${esc(u.name)}"></span>`;let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))%360;return `<span class="av" style="background:${isAdmin()&&MCOK(u.mc)?u.mc:`hsl(${h} 50% 42%)`}" title="${esc(u.name)}">${esc(ini(u.name))}</span>`};

const SAVE_OK=["gif","png","jpg","jpeg","webp","mp4","webm","mov","txt","json","md","docx","pptx","epub","csv","ttf","html","svg","pdf","xlsx","zip"];
function crc32(u){let t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let r=-1;for(let i=0;i<u.length;i++)r=t[(r^u[i])&255]^(r>>>8);return(r^-1)>>>0}
function zipStore(name,u8){const nb=new TextEncoder().encode(name),crc=crc32(u8),sz=u8.length;
const lh=new DataView(new ArrayBuffer(30));lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,nb.length,true);
const ch=new DataView(new ArrayBuffer(46));ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,nb.length,true);
const en=new DataView(new ArrayBuffer(22));en.setUint32(0,0x06054b50,true);en.setUint16(8,1,true);en.setUint16(10,1,true);en.setUint32(12,46+nb.length,true);en.setUint32(16,30+nb.length+sz,true);
return new Blob([lh.buffer,nb,u8,ch.buffer,nb,en.buffer],{type:"application/zip"})}

async function impLoad(file){IMP.msg="Читаю файл…";render();await sleep(50);

async function impPool(jobs,label){let i=0,done=0,fail=0;const n=jobs.length;

const FEE=7;
function mgCalc(d){const a=+d.amount||0,c=+d.cost||0,base=a,fee=base*FEE/100,net=base-fee,margin=net-c;return{base,fee,net,cost:c,margin,pct:base?margin/base*100:0,hasFinal:true}}
function mgBox(d,edit){const m=mgCalc(d);if(!m.base&&!edit)return"";const bad=m.margin<0;
return `<div class="mgb${edit?" mge":""}"><div><span>${"Сумма закупки"}</span><b>${rub(m.base)}</b></div><div class="neg"><span>− ${FEE}%</span><b>− ${rub(Math.round(m.fee*100)/100)}</b></div><div><span>После вычета ${FEE}%</span><b>${rub(Math.round(m.net*100)/100)}</b></div>${edit?`<div class="neg cst"><span>− Затраты</span><input class="cin"${d.id?` data-id="${d.id}" data-v="${m.cost||""}"`:""} type="number" inputmode="decimal" min="0" step="any" placeholder="нажми и впиши" value="${m.cost||""}"></div>`:m.cost?`<div class="neg"><span>− Затраты</span><b>− ${rub(m.cost)}</b></div>`:""}<div class="tot${bad?" bad":""}"><span>Маржа${m.cost?"":" <small>(затраты не указаны)</small>"}</span><b>${rub(Math.round(m.margin*100)/100)} <small>${m.pct.toFixed(1).replace(".",",")}%</small></b></div></div>`}

<script>
/* ===== ПРАВКИ 3: таблица в «Организациях», сохранение прокрутки, прокрутка к найденному ===== */
const XNAMES=["Отказы","Завершены","Завершены 1"],XCOL=[["Закупка",104],["ИНН",112],["Содержание",260],["Плановая дата договора",150],["Сумма",110],["Затраты",110],["Прибыль (авто)",120],["Срок поставки",170],["Контакты",330],["Адрес",330]],RH=30,HH=34,XN=50;
const XW=XCOL.reduce((t,c)=>t+c[1],XN);
const XLV={mode:"table",base:null,sh:0,docs:new Map(),rows:[[],[],[]],dl:{},ready:false,err:"",sel:null,ed:null,view:[],mset:new Set(),mt:[],mi:0,only:false,st:0,sl:0,pend:false,ver:0,mc:null,mcq:"",mcv:-1};
let SCRQ=false;const CAPK=60,CAPL=300;
const isLostD=d=>{const l=(S.stat&&S.stat.lost)||stages().filter(x=>x[0]==="lost"||/провал|отказ|проигр|отмен/i.test(x[1])).map(x=>x[0]);return l.includes(d.stage)};
const xlCan=()=>typeof pEditAll==="function"&&pEditAll();
const xlNum=s=>{const v=parseFloat(String(s==null?"":s).replace(/\s/g,"").replace(",","."));return isNaN(v)?null:v};
const xlProfit=r=>{const a=xlNum(r.c[4]);if(a===null)return"";return Math.round((a*(100-FEE)/100-(xlNum(r.c[5])||0))*100)/100};
const xlF=v=>v===""||v==null?"":Number(v).toLocaleString("ru-RU");
const XP="https://market.mosreg.ru/Trade/ViewTrade/";
const xlCA=a=>{const c=[];for(let j=0;j<10;j++)c.push(a&&a[j]!=null?String(a[j]):"");return c};
function xlBuild(){const T=XLV;if(!T.base)return;const sh=[[],[],[]],seen=new Set(),mk=(ov,s,id)=>({id,s,d:id,o:ov.o!=null?ov.o:0,a:ov.a||0,dl:ov.dl||T.dl[id]||"",c:xlCA(ov.c)});
T.base.forEach((a,s)=>a.forEach(r=>{seen.add(r.id);const ov=T.docs.get(r.id);if(!ov)sh[s].push(r);else if(!ov.del)sh[s].push(mk({...ov,o:ov.o!=null?ov.o:r.o},s,r.id))}));
T.docs.forEach(ov=>{const s=ov.s|0;if(seen.has(ov.id)||ov.del||!sh[s]||!ov.c)return;sh[s].push(mk(ov,s,ov.id))});
sh.forEach(a=>a.sort((a,b)=>a.o-b.o));T.rows=sh;T.ver++;T.ready=true}
async function xlLoad(){const T=XLV;if(T.base||T.loading)return;T.loading=true;try{const bin=atob(document.getElementById("xlseed").textContent.trim()),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
const data=JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
T.base=data.map((sh,s)=>sh.rows.map((row,k)=>({id:"r"+s+"_"+k,s,d:"r"+s+"_"+k,o:(k+1)*1000,a:0,dl:"",c:xlCA(row.map((v,j)=>j===0&&/^\d+$/.test(v)?XP+v:v))})));xlBuild();xlRefresh()}catch(x){T.err="не удалось прочитать данные: "+(x.message||x);T.base=[[],[],[]];xlBuild();xlRefresh()}T.loading=false}
function xlMatch(){const T=XLV;if(T.mcq===q&&T.mcv===T.ver&&T.mc)return T.mc;T.mc=T.rows.map(a=>q?a.filter(r=>hit(r.c)).map(r=>r.id):[]);T.mcq=q;T.mcv=T.ver;return T.mc}
function xlIdx(){const T=XLV,all=T.rows[T.sh],mc=xlMatch();T.mset=new Set(mc[T.sh]);T.view=T.only&&q?all.filter(r=>T.mset.has(r.id)):all;T.mt=[];if(q)T.view.forEach((r,i)=>{if(T.mset.has(r.id))T.mt.push(i)});if(T.mi>=T.mt.length)T.mi=0}
function xlSw(){return `<span class="seg"><button class="btn ${XLV.mode==="table"?"sel":"ghost"}" onclick="XLV.mode='table';render()">Таблица</button><button class="btn ${XLV.mode==="list"?"sel":"ghost"}" onclick="XLV.mode='list';render()">Список организаций</button></span>`}
function xlSheet(i){XLV.sh=i;XLV.sel=null;XLV.st=0;XLV.mi=0;render();const v=document.getElementById("xlv");if(v&&XLV.mt.length)xlGoto(0)}
function xlOrgs(){
const T=XLV,head=`<div class="tb"><h1>Организации</h1>${xlSw()}</div>`;xlSub();xlLoad();if(!T.base)return head+`<div class="empty">Загружаю таблицу…</div>`;
const warn=T.err?`<div class="mu" style="padding:0 16px 8px;color:var(--bad)">⚠ Правки пока не сохраняются в базу: ${esc(T.err)}. Если это «permission-denied», разрешите в правилах Firestore коллекцию <b>xl</b>.</div>`:"";
if(SCRQ&&q){const mc=xlMatch();if(!mc[T.sh].length){const f=mc.findIndex(x=>x.length);if(f>=0){T.sh=f;T.st=0}}}
xlIdx();const mc=xlMatch(),all=T.rows[T.sh],can=xlCan();
let sm=0,co=0,pr=0;all.forEach(r=>{const a=xlNum(r.c[4]);if(a!==null){sm+=a;co+=xlNum(r.c[5])||0;pr+=xlProfit(r)||0}});
return head+warn+`<div class="xtl"><span class="seg">${XNAMES.map((n,i)=>`<button class="btn ${T.sh===i?"sel":"ghost"}" onclick="xlSheet(${i})">${n} <small>${T.rows[i].length}${q&&mc[i].length?" · найдено "+mc[i].length:""}</small></button>`).join("")}</span>
${can?`<button class="btn ghost" onclick="xlAdd()">+ Строка</button><button class="btn ghost" onclick="xlDel()">Удалить строку</button>`:`<span class="mu">Только просмотр</span>`}
<button class="btn ghost" onclick="xlExport()">⬇ Скачать .xlsx</button>
${q?`<span class="mu">Найдено на листе: <b>${T.mt.length}</b></span><button class="btn ghost" onclick="xlNext(-1)">▲</button><button class="btn ghost" onclick="xlNext(1)">▼</button><label class="ck" style="margin:0"><input type="checkbox" ${T.only?"checked":""} onchange="XLV.only=this.checked;XLV.st=0;render()">Только найденные</label>`:""}
<span class="mu sm" id="xlsum" style="margin-left:auto">Лист: сумма ${rub(Math.round(sm))} · затраты ${rub(Math.round(co))} · прибыль ${rub(Math.round(pr))}</span></div>
<div class="xlv" id="xlv" tabindex="0"><div class="xlg" style="width:${XW}px"><div class="xlh"><div class="xn">№</div>${XCOL.map(c=>`<div style="width:${c[1]}px">${c[0]}</div>`).join("")}</div><div class="xlb" id="xlb" style="height:${T.view.length*RH}px"><div id="xrs"></div></div></div></div>`}
function xlCell(r,j){const v=r.c[j];let h,cl="";
if(j===6){const p=xlProfit(r);h=p===""?"":esc(xlF(p));cl=" xp"+(p<0?" neg":"")}
else if(j===4||j===5){h=esc(xlF(xlNum(v)===null?v:xlNum(v)));cl=" xu"}
else if(j===0&&/^https?:/.test(v)){const m=v.match(/(\d+)\/?$/);h=`<a href="${esc(v)}" target="_blank" rel="noopener" onmousedown="event.stopPropagation()">№${m?m[1]:"ссылка"}</a>`}
else h=esc(v).replace(/\n/g," · ");
const s=XLV.sel&&XLV.sel.id===r.id&&XLV.sel.c===j?" xs":"";
return `<div class="${(cl+s).trim()}" style="width:${XCOL[j][1]}px" data-c="${j}"${j!==0&&j!==6&&v.length>12?` title="${esc(v)}"`:""}>${h}</div>`}
function xlPaint(){const vp=document.getElementById("xlv"),box=document.getElementById("xrs");if(!vp||!box)return;const T=XLV,n=T.view.length,vh=vp.clientHeight;
const a=Math.max(0,Math.floor(T.st/RH)-2),b=Math.min(n-1,Math.ceil((T.st+vh)/RH)+2),cur=T.mt[T.mi];let h="";
for(let i=a;i<=b;i++){const r=T.view[i];h+=`<div class="xr${T.mset.has(r.id)?" xm":""}${cur===i&&q?" xcur":""}" style="top:${i*RH}px" data-i="${i}"><div class="xn">${i+1}</div>${r.c.map((_,j)=>xlCell(r,j)).join("")}</div>`}
